<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poker RNG</title>
  <style>
    /* ===== Font ===== */
    @font-face{
      font-family:'Digital7';
      src: url('./assets/fonts/digital-7.ttf') format('truetype');
      font-display: swap;
    }

    /* ===== Reset / Window ===== */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;            /* no scrollbars */
      background: transparent;     /* true transparent window */
      -webkit-user-select: none;
      user-select: none;
    }

    /* Whole window is the draggable frame by default */
    .frame {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      -webkit-app-region: drag;    /* drag anywhere except explicit no-drag areas */
    }

    /* Card look (rounded, no outside glow) */
    .card {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background: rgba(18,18,18,0.68);
      box-shadow: inset 0 0 22px rgba(0,0,0,.35);
      display: grid;
      place-items: center;
      overflow: hidden;            /* hard clip to radius */
    }

    /* Big click hotspot that is NOT draggable */
    .hotspot {
      position: relative;
      width: 82%;
      height: 82%;
      max-width: 100%;
      max-height: 100%;
      display: grid;
      place-items: center;
      -webkit-app-region: no-drag; /* let clicks reach renderer code */
      cursor: pointer;
      background: transparent;
      border-radius: 12px;
    }

    /* Fixed-width 2 digits (0..99) with tabular spacing */
    .num {
      font-family: 'Digital7','Digital-7', ui-monospace, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
      line-height: 1;
      font-weight: 400;
      color: #e9ecef;
      letter-spacing: 0;
      font-size: 56px;             /* will be overridden responsively in renderer.js */
      transition: color 120ms ease-out;
      display: flex;
      width: 2ch;                  /* constant width for two digits */
      justify-content: center;
    }
    .num .d {
      display: inline-block;
      width: 1ch;                  /* each digit occupies the same space */
      text-align: center;
    }
  </style>
</head>
<body oncontextmenu="return false">
  <div class="frame">
    <div class="card">
      <div class="hotspot" id="hotspot" title="Click to roll">
        <div id="num" class="num" aria-live="polite">
          <span class="d">0</span><span class="d">0</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
